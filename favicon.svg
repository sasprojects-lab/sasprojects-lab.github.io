<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141d"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ff4e50"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.75"/>

  <!-- Vinyl Record Outer Ring -->
  <circle cx="32" cy="32" r="23" fill="#131822" stroke="url(#brandGrad)" stroke-width="1.2"/>
  
  <!-- Grooves -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#252d3d" stroke-width="0.8" stroke-dasharray="3,1.5"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#252d3d" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#252d3d" stroke-width="0.6"/>

  <!-- Center Core Label -->
  <circle cx="32" cy="32" r="8" fill="url(#accentPink)"/>
  
  <!-- Center Spindle Hole -->
  <circle cx="32" cy="32" r="2.8" fill="#06080c" stroke="#ffffff" stroke-width="1"/>

  <!-- Audio Wave Pulses on Sides -->
  <line x1="6" y1="32" x2="6" y2="32" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="32" x2="58" y2="32" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
